name: Vérifier les pages publiques de bêta-test

on:
  push:
    branches: [main]
    paths:
      - 'beta/**'
      - '.github/workflows/verify-beta-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Tester les contenus publiés sur GitHub Pages via HTTPS
        shell: bash
        run: |
          set -euo pipefail
          root='https://mahamadou97.github.io/autour-de-moi-confidentialite'
          for page in beta/autour-de-moi beta/color-cascade; do
            url="$root/$page/"
            echo "Contrôle HTTPS public : $url"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 "$url" -o "/tmp/$(basename "$page").html"
            grep -qi 'Bêta-test' "/tmp/$(basename "$page").html"
            grep -qi 'Demander une invitation' "/tmp/$(basename "$page").html"
            grep -qi 'contact.mt.apps@gmail.com' "/tmp/$(basename "$page").html"
            echo "OK : $page"
          done
          echo 'Les deux pages sont publiquement lisibles et ne nécessitent pas de connexion GitHub.'
